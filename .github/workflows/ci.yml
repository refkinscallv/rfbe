name: CI

# Normal development: validate every push and pull request to the main branches.
on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [18.x, 20.x, 22.x]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npx prettier --check .

            - name: Boot smoke test
              # Start the app with the database disabled and confirm it serves HTTP.
              env:
                  APP_ENV: test
                  APP_PORT: '3000'
                  DB_ENABLED: 'false'
                  CRON_ENABLED: 'false'
              run: |
                  node . &
                  APP_PID=$!
                  for i in $(seq 1 20); do
                    if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
                      break
                    fi
                    sleep 1
                  done
                  curl -fsS http://localhost:3000/
                  curl -fsS http://localhost:3000/api/ping
                  kill "$APP_PID"
