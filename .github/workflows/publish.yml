name: Publish

# Publishing a GitHub Release (tag like v1.0.0) publishes the package to npm,
# which is what makes `npm create rfbe@latest my-app` work.
on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write # required for npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify it boots
              env:
                  APP_ENV: test
                  APP_PORT: '3000'
                  DB_ENABLED: 'false'
                  CRON_ENABLED: 'false'
              run: |
                  node . &
                  APP_PID=$!
                  for i in $(seq 1 20); do
                    if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then break; fi
                    sleep 1
                  done
                  curl -fsS http://localhost:3000/
                  kill "$APP_PID"

            - name: Sync package version to the release tag
              # Tag v1.2.3 -> package version 1.2.3
              run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

            - name: Publish to npm
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
